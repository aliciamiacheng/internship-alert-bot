name: Internship Monitor
on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
permissions:
  contents: write
jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python monitor.py
      - name: Persist seen jobs and latest alert
        run: |
          git config user.name "internship-alert-bot"
          git config user.email "actions@users.noreply.github.com"
          git add seen_jobs.json latest_alert.md
          git diff --cached --quiet || git commit -m "Update internship alerts"
          git push
