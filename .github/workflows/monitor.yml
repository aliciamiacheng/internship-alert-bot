name: Internship Monitor
on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
permissions:
  contents: write
jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Scan internships
        id: scan
        run: |
          python monitor.py
          echo "new_matches=$(tr -d '\n' < new_matches_found.txt)" >> "$GITHUB_OUTPUT"
      - name: Email new internship matches
        if: steps.scan.outputs.new_matches == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_APP_PASSWORD }}
          subject: "New Summer 2027 Internship Matches"
          to: aliciamiacheng@gmail.com
          from: Internship Alert Bot
          body: file://latest_alert.md
      - name: Persist seen jobs and latest alert
        run: |
          git config user.name "internship-alert-bot"
          git config user.email "actions@users.noreply.github.com"
          git add seen_jobs.json latest_alert.md
          git diff --cached --quiet || git commit -m "Update internship alerts"
          git push
