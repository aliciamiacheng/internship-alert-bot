name: Internship Monitor
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "monitor.py"
      - "verify.py"
      - "test_monitor.py"
      - "config.yaml"
      - "companies.csv"
      - ".github/workflows/monitor.yml"
  schedule:
    - cron: "17 */6 * * *"
    - cron: "43 13 * * 1"
permissions:
  contents: write
concurrency:
  group: internship-monitor
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m unittest -q test_monitor
      - name: Scan internships
        id: scan
        run: |
          python monitor.py
          echo "new_matches=$(tr -d '\n' < new_matches_found.txt)" >> "$GITHUB_OUTPUT"
          echo "new_health_errors=$(tr -d '\n' < health_errors_found.txt)" >> "$GITHUB_OUTPUT"
          cat source_health.md >> "$GITHUB_STEP_SUMMARY"
      - name: Email new internship matches
        if: steps.scan.outputs.new_matches == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_APP_PASSWORD }}
          subject: "Internship matches found"
          to: aliciamiacheng@gmail.com
          from: Internship Alert Bot
          body: file://latest_alert.md
      - name: Email newly broken sources
        if: steps.scan.outputs.new_health_errors == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_APP_PASSWORD }}
          subject: "Internship bot source failure"
          to: aliciamiacheng@gmail.com
          from: Internship Alert Bot
          body: file://health_alert.md
      - name: Email weekly coverage report
        if: github.event.schedule == '43 13 * * 1'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_APP_PASSWORD }}
          subject: "Weekly internship source coverage"
          to: aliciamiacheng@gmail.com
          from: Internship Alert Bot
          body: file://source_health.md
      - name: Persist seen jobs and latest alert
        run: |
          git config user.name "internship-alert-bot"
          git config user.email "actions@users.noreply.github.com"
          git add seen_jobs.json latest_alert.md source_health.json source_health.md
          git diff --cached --quiet || git commit -m "Update internship alerts"
          git push
      - name: Verify every configured source
        run: python verify.py
